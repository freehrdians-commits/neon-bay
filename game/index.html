<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Neon Bay — an open-world crime game in a desktop browser. Four story jobs for Rook, car chases, nitro, neon tags and a police force that sets roadblocks.">
<title>Neon Bay — an open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11141b; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Neon Bay: an open-world crime game. Drive, steal cars, run four jobs for Delia, grab the ledger, collect neon tags, and stay ahead of the police."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#fff;font:16px sans-serif;text-align:center">Neon Bay needs JavaScript to run.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
